<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blocked by SentinelGrid Web Shield</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #070B14; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { max-width: 540px; padding: 32px; border-radius: 18px; background: #0F172A; border: 1px solid rgba(239, 68, 68, 0.5); box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; background: rgba(239,68,68,0.18); color: #fca5a5; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.6; }
    .url { padding: 10px 12px; border-radius: 10px; background: #090E19; border: 1px solid #1E293B; font-family: monospace; font-size: 12px; color: #fca5a5; word-break: break-all; margin: 14px 0; }
    button { padding: 10px 16px; border-radius: 10px; border: none; background: #10b981; color: #052e16; font-weight: 700; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">SENTINELGRID WEB SHIELD · INTERCEPTED</span>
    <h1>Malicious or Phishing Page Blocked</h1>
    <p id="reason">SentinelGrid stopped navigation before this page could load or steal credentials.</p>
    <div class="url" id="blockedUrl"></div>
    <button onclick="history.back()">Return to Safety</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('blockedUrl').textContent = params.get('url') || 'Unknown URL';
    if (params.get('reason')) document.getElementById('reason').textContent = params.get('reason');
  </script>
</body>
</html>
